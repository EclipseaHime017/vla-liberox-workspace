# Shared official FACTR runtime for GUI and the terminal test.
# Never run two controllers against the same device at the same time.
mode: device
device_name: FACTR Franka
# Discover the current serial port without opening it. No fixed /dev path.
vendor_id: 0x0403
product_id: 0x6014
serial_number: null  # Specify USB serial number if multiple devices match.
baudrate: 4000000
motor_ids: [1, 2, 3, 4, 5, 6, 7, 8]
motor_models: [XC330_T288_T, XM430_W210_T, XC330_T288_T, XM430_W210_T, XC330_T288_T, XC330_T288_T, XC330_T288_T, XC330_T288_T]
joint_signs: [1, 1, 1, -1, 1, -1, 1]
# Fixed official Figure 1 reference (rad), not the Figure 2 resting pose.
# Must match the pinned upstream calibration_joint_pos; no custom pose override.
reference_joint_positions: [0.0, -0.7854, 0.0, -2.356, 0.0, 1.57, 0.0]
# One whole-arm reference capture for both FK and gravity, as in official FACTR.
# Place the whole arm in Figure 1 and release the trigger before calibration.
joint_limits_min: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
joint_limits_max: [2.8973, 1.7628, 2.8973, -0.8698, 2.8973, 3.7525, 2.8973]
stale_timeout_ms: 250
max_joint_jump_rad: 0.35
gripper_min_travel_rad: 0.15
gripper_max_travel_rad: 1.5
gripper_open_threshold: 0.35
gripper_close_threshold: 0.65
gripper_takeover_delta: 0.12
translation_gain: 0.25
rotation_gain: 0.25
test_duration_seconds: 30.0
max_steps: 600
countdown_seconds: 3

# Official control parameters remain in the pinned upstream grav_comp_demo.yaml.
# One calibration captures the released trigger as zero; official range is 0.8 rad.
runtime:
  upstream_root: ../third_party/FACTR_Teleop
  runtime_python: ../third_party/factr-runtime/bin/python
  calibration_file: ../runs/factr_calibration/calibration.json
