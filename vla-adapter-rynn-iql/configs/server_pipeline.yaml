# Server-branch-only multi-GPU entrypoint; main keeps its single-GPU UI runner.
schema_version: 3
training_config: ./training/iql.yaml
runs_root: ../../dataset-root/projects/libero_x_vla/runs
task_id: null  # choose a task in the terminal; all its marked runs are used
output_root: ../outputs/server-training
cache_root: ../outputs/server-replay-cache
environment: vla-liberox
reward_source: final
distributed:
  # Indices within CUDA_VISIBLE_DEVICES when set, otherwise physical GPU indices.
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  backend: nccl
  zero_stage: 1
  timeout_seconds: 1800
  data_workers_per_rank: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
overrides:
  training:
    method: iql  # iql | bc; BC never reads rewards
    train_steps: 10000
    micro_batch_size: 8  # GLOBAL: eight GPUs each process one chunk
    gradient_accumulation_steps: 4  # global actor effective batch = 32
    checkpoint_interval: 512
  # Other model/training/iql/logging fields use the current shared configuration.
  # Copy complete run directories from the PC, including adjacent global evaluations.
  # Evaluator/fusion parameters come from each run's saved global reward.
  reward: {}  # optional gamma / accumulate_primitive_steps overrides only
