# Server-branch-only multi-GPU entrypoint; main keeps its single-GPU UI runner.
schema_version: 4
training_config: ./training/iql.yaml
runs_root: ../../dataset-root/projects/libero_x_vla/runs
task_id: null  # auto-select a single task; otherwise set this or pass --task
output_root: ../outputs/server-training
cache_root: ../outputs/server-replay-cache
reward_source: final
distributed:
  # Indices within CUDA_VISIBLE_DEVICES when set, otherwise physical GPU indices.
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  backend: nccl
  zero_stage: 1
  timeout_seconds: 1800
  data_workers_per_rank: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
# Global batches and trainable components are selected with the model family.
# Explicit overrides below take precedence over these server-only defaults.
model_profiles:
  vla_adapter:
    training:
      micro_batch_size: 64  # eight GPUs each process eight chunks
      gradient_accumulation_steps: 1
    model:
      backbone: lora
      lora: {rank: 64}
  pi05:
    training:
      micro_batch_size: 32  # eight GPUs each process four chunks
      gradient_accumulation_steps: 1
    model:
      backbone: full
overrides:
  training:
    method: iql  # iql | bc; BC never reads rewards
    train_steps: 10000
    checkpoint_interval: 512
  model:
    family: vla_adapter  # vla_adapter | pi05
    base_id: base  # pi05-libero-base | pi05-liberox-base for pi05
  # Other model/training/iql/logging fields use the current shared configuration.
  # Copy complete run directories from the PC, including adjacent global evaluations.
  # Evaluator/fusion parameters come from each run's saved global reward.
  reward: {}  # optional gamma / accumulate_primitive_steps overrides only
