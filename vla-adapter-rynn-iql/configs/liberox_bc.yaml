schema_version: 1
training:
  method: bc
  train_steps: 10000  # micro-batches, identical semantics to IQL
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  checkpoint_interval: 512
  actor_lr_warmup_steps: 1000
  policy_peak_lr: 0.00003
  policy_final_lr: 0.000003
  resume_checkpoint: null
  seed: 7
  device: cuda:0
  dtype: bfloat16
paths:
  dataset_sources: [../../dataset-root]
  work_dir: ../outputs/bc-work
  output_dir: ../outputs/training
  annotation_cache: ../outputs/annotation-cache  # unused by BC
  vla_adapter_root: ../../VLA-Adapter
  libero_x_root: ../../LIBERO-X
  rynnvalue_root: ../../RynnValue  # unused by BC; installation not required
  policy_registry: ../../policy-registry
data:
  project_id: libero_x_vla
  task_ids: []
  selection_manifest: null
  action_horizon: 8
  action_dim: 7
  proprio_dim: 8
  control_hz: 20.0
  success_consecutive_steps: 5
  validation_fraction: 0.2
  split_seed: 7
  allow_no_success: true
vla:
  base_checkpoint: VLA-Adapter/LIBERO-Object-Pro
  stats_key: libero_object
  use_pro_version: true
  freeze_backbone: true
logging:
  tensorboard: true
  wandb:
    enabled: false
    mode: online
    project: vla-adapter-rynn-iql
    entity: null
    run_name: null
    group: null
    tags: [liberox, bc]
    log_interval_steps: 10
  flush_seconds: 5
  console_interval_steps: 10
