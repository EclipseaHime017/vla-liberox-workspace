schema_version: 1
paths:
  dataset_sources:
    - ../../dataset-root
  work_dir: ../outputs/work
  output_dir: ../outputs/training
  annotation_cache: ../outputs/annotation-cache
  vla_adapter_root: ../../VLA-Adapter
  libero_x_root: ../../LIBERO-X
  rynnvalue_root: ../../RynnValue
  policy_registry: ../../policy-registry
data:
  project_id: libero_x_vla
  task_ids: []
  # Optional immutable UI dataset manifest. null preserves recursive CLI discovery.
  selection_manifest: null
  action_horizon: 8
  action_dim: 7
  proprio_dim: 8
  control_hz: 20.0
  success_consecutive_steps: 5
  validation_fraction: 0.2
  split_seed: 7
  allow_no_success: true
reward:
  model: Alibaba-DAMO-Academy/RynnValue-4B
  revision: 3f73b5d2b5e53b21f248c8791004dde6a8cf2b92
  device: cuda:0
  dtype: bfloat16
  # RynnValue paper Appendix B.3 uses four uniformly sampled causal-prefix
  # frames for offline reward relabeling (the standalone demo defaults to 64).
  max_frames: 4
  annotation_batch_size: 1
  # The fields above define expensive RynnValue inference and its reusable cache.
  # The fields below only derive training rewards from cached model outputs.
  # Changing them never requires another RynnValue forward pass.
  # false: train from the environment sparse reward only; cached evaluations stay intact.
  rynnvalue: true
  # One discount per action chunk (macro action), not one discount per 20 Hz action.
  gamma: 0.99
  shaping_weight: 0.1
  # false: one sparse/PBRS reward and one Bellman discount per action chunk.
  # true: discounted primitive-step return and gamma^L Semi-MDP bootstrap.
  accumulate_primitive_steps: false
  robot_description: Franka Emika Panda single-arm robot
  camera_description: fixed third-person agent view
vla:
  base_checkpoint: VLA-Adapter/LIBERO-Object-Pro
  stats_key: libero_object
  use_pro_version: true
  freeze_backbone: true
iql:
  critic_image_size: 128
  critic_lr: 0.0003
  value_lr: 0.0003
  # Match the earlier AdamW Q/V setup: PyTorch default betas/eps and 0.01 decay.
  # Supported values remain adam and adamw for controlled ablations.
  critic_optimizer: adamw
  critic_weight_decay: 0.01
  value_optimizer: adamw
  value_weight_decay: 0.01
  critic_max_grad_norm: 10.0
  value_max_grad_norm: 10.0
  policy_peak_lr: 0.00003
  policy_final_lr: 0.000003
  expectile: 0.8
  beta: 3.0
  max_advantage_weight: 20.0
  target_tau: 0.005
  critic_warmup_steps: 1000
  train_steps: 10000
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  checkpoint_interval: 512
  resume_checkpoint: null
  seed: 7
  device: cuda:0
  dtype: bfloat16
logging:
  # TensorBoard events are written beside metrics.jsonl for each training run.
  tensorboard: true
  wandb:
    # Online mode requires `wandb login` before unattended training.
    enabled: false
    mode: online
    project: vla-adapter-rynn-iql
    entity: null
    run_name: null
    group: null
    tags: [liberox, rynnvalue, iql]
    log_interval_steps: 10
  flush_seconds: 5
  # Print progress, rolling throughput, ETA, losses and VRAM every N train steps.
  console_interval_steps: 10
