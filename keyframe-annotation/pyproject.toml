[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyframe-annotation"
version = "0.1.0"
description = "Read-only robotic event annotation experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
vlm = ["transformers==4.57.6", "accelerate>=1.2,<2", "huggingface-hub>=0.34,<1", "torch>=2.7,<2.9", "torchvision>=0.22,<0.24"]

[tool.setuptools.packages.find]
where = ["src"]
