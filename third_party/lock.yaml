    torch: 2.8.0
    torchvision: 0.23.0
    torchao: 0.13.0
    xformers: 0.0.32.post2
    transformers: 4.57.1
    trl: 0.20.0
    cuda_wheel_index: https://download.pytorch.org/whl/cu128

