# Every upstream this repository builds on, as siblings: pinned source, local patch,
# weights and the package versions checked at runtime. Checkouts live in
# third_party/<checkout>/ and are not committed; `python envs/setup.py --role ...`
# clones only the upstreams a role needs. Readers: core/upstream.py (upstream_lock).
schema_version: 2

libero_x:              # simulator: scenes, BDDL tasks, initial states
  repository: https://github.com/meituan/LIBERO-X.git
  commit: f528726421c7211d8eb05fe48e9e5e2535ccc813
  checkout: LIBERO-X
  packages:            # verified by sim/runtime.py before a headless rollout
    mujoco: 2.3.7
    robosuite: 1.4.1
    numba: 0.59.1
    numpy: 1.26.4
    bddl: 3.6.0
    gym: 0.26.2
    PyOpenGL: 3.1.10

vla_adapter:           # policy family (vla-liberox environment)
  repository: https://github.com/OpenHelix-Team/VLA-Adapter.git
  commit: 23fa0c9c159e2aa04341cdd3e924f44061311060
  checkout: VLA-Adapter
  patch:               # local OpenVLA class registration and Hub cache lookup
    path: patches/vla_adapter_hf_local_autoclass.patch
    sha256: b6a5f8e21da1c15d2a5bea0cfd4ccca11440f3e5177622e942ac3f9ab4751500
  weights: VLA-Adapter/LIBERO-Object-Pro
  packages:
    transformers: 4.40.1
    tensorflow: 2.15.0

openpi:                # π₀.₅ family (pi05 environment, built from the upstream uv.lock)
  repository: https://github.com/Physical-Intelligence/openpi.git
  commit: 215abfb217dbac7d5f1273282331b9b1866c0479
  checkout: OpenPI

rynnvalue:             # reward model (rynnvalue-reward environment); loaded from source, not installed
  repository: https://github.com/alibaba-damo-academy/RynnValue.git
  commit: 10e0d333f5f3811d0d130587e50f1faf48da49e5
  checkout: RynnValue
  weights: Alibaba-DAMO-Academy/RynnValue-4B
  weights_revision: 3f73b5d2b5e53b21f248c8791004dde6a8cf2b92

robometer:             # reward model (robometer-reward environment)
  repository: https://github.com/robometer/robometer.git
  commit: 352d160389daa964788de1ec933d1925f3a6de4f
  checkout: Robometer
  weights: aliangdw/Robometer-4B-LIBERO
  weights_revision: bb7dce7e6bde3bd236c0fbe0be46fdf19b57b873
